name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # In the public repository this runs on every pull request and every push to main. Anywhere else (a private copy, where a run costs money) it only runs when it is started by hand.
    if: github.repository == 'ample-koda/ample' || github.event_name == 'workflow_dispatch'
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install the browser the server tests drive
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests/Ample.Server.Tests ]; then
            dotnet build tests/Ample.Server.Tests -c Release --nologo
            pwsh tests/Ample.Server.Tests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium
          fi
      - name: Cache the General MIDI SoundFont
        # the tests that play General MIDI (the Lite demos, the SoundFont renderer) need it; it is fetched once and kept between runs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ample-home/audio-packs
          key: musescore-general-home-${{ hashFiles('tools/fetch-gm-soundfont.mjs') }}
      - name: Fetch the General MIDI SoundFont
        # into the library folder the tests use (AMPLE_HOME); the script checks the size and the pinned SHA-256 and does not download again when the file is there
        env:
          AMPLE_PACK_OUT: ${{ github.workspace }}/.ample-home/audio-packs
        run: node tools/fetch-gm-soundfont.mjs --download
      - name: Test every test project
        shell: bash
        env:
          AMPLE_HOME: ${{ github.workspace }}/.ample-home
        run: |
          set -euo pipefail
          for project in tests/*.Tests/*.csproj; do
            dotnet test "$project" -c Release --nologo
          done

  studio:
    # In the public repository this runs on every pull request and every push to main. Anywhere else (a private copy, where a run costs money) it only runs when it is started by hand.
    if: github.repository == 'ample-koda/ample' || github.event_name == 'workflow_dispatch'
    # The browser tests of the studio (Playwright, Chromium): they start the built command line tool and drive its pages.
    name: Studio browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the command line tool
        run: dotnet build src/Ample.Cli -c Release --nologo
      - name: Install the test tools and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Cache the General MIDI SoundFont
        # the tests that play General MIDI need it; it is fetched once and kept between runs
        uses: actions/cache@v4
        with:
          path: audio-packs/licensed/musescore-general
          key: musescore-general-${{ hashFiles('tools/fetch-gm-soundfont.mjs') }}
      - name: Fetch the General MIDI SoundFont
        # the script checks the size and the pinned SHA-256 of the SoundFont, and does not download again when the file is already there (from the cache)
        run: node tools/fetch-gm-soundfont.mjs --download --into
      - name: Run the browser tests
        # no retry: a test that fails fails (the owner's rule); the traces below show why
        run: npx playwright test --project=chromium --workers=2 --trace=retain-on-failure
      - name: Keep the traces of the failed tests
        # a trace shows the page, the steps and the console of a test that failed, to be opened with npx playwright show-trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-traces
          path: test-results/
          retention-days: 7

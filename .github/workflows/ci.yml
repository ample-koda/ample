name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # In the public repository this runs on every pull request and every push to main. Anywhere else (a private copy, where a run costs money) it only runs when it is started by hand.
    if: github.repository == 'ample-koda/ample' || github.event_name == 'workflow_dispatch'
    # The test projects run in three groups at the same time (the server tests are the slowest and drive a browser; the engine and audio tests come next; the rest is
    # every other project in tests/, so a new test project is picked up without a change here).
    name: Test (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [server, engine, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Keep the NuGet packages between runs
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Keep the browser of the server tests between runs
        if: matrix.group == 'server'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-server-tests-${{ hashFiles('**/Directory.Packages.props') }}
      - name: Install the browser the server tests drive
        if: matrix.group == 'server'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/Ample.Server.Tests -c Release --nologo
          pwsh tests/Ample.Server.Tests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium
      - name: Cache the General MIDI SoundFont
        # the tests that play General MIDI (the Lite demos, the SoundFont renderer) need it; it is fetched once and kept between runs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ample-home/audio-packs
          key: musescore-general-home-${{ hashFiles('tools/fetch-gm-soundfont.mjs') }}
      - name: Fetch the General MIDI SoundFont
        # into the library folder the tests use (AMPLE_HOME); the script checks the size and the pinned SHA-256 and does not download again when the file is there
        env:
          AMPLE_PACK_OUT: ${{ github.workspace }}/.ample-home/audio-packs
        run: node tools/fetch-gm-soundfont.mjs --download
      - name: Test this group of test projects
        shell: bash
        env:
          AMPLE_HOME: ${{ github.workspace }}/.ample-home
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$GROUP" in
            server) projects="tests/Ample.Server.Tests/Ample.Server.Tests.csproj" ;;
            engine) projects="tests/Ample.Engine.Tests/Ample.Engine.Tests.csproj tests/Ample.Audio.Tests/Ample.Audio.Tests.csproj tests/Ample.Plugins.Tests/Ample.Plugins.Tests.csproj" ;;
            rest) projects=$(ls tests/*.Tests/*.csproj | grep -v -e Ample.Server.Tests -e Ample.Engine.Tests -e Ample.Audio.Tests -e Ample.Plugins.Tests) ;;
            *) echo "unknown group $GROUP"; exit 2 ;;
          esac
          for project in $projects; do
            [ -f "$project" ] || continue
            dotnet test "$project" -c Release --nologo
          done

  studio-plan:
    # How the browser tests are divided. The normal tests go in shards of about 200 (counted from the suite, so the number grows with it). A test whose title carries
    # @quarantine (it failed, and is waiting for a fix) never runs in those shards: the quarantined tests run apart, 10 to a job, one worker each, and do not fail the run.
    # tools/quarantine-failed.mjs puts the tag on the tests of a failed run.
    if: github.repository == 'ample-koda/ample' || github.event_name == 'workflow_dispatch'
    name: Studio browser tests (plan)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.count.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the test tools
        run: npm ci
      - name: Count the tests and build the list of jobs
        id: count
        shell: bash
        run: |
          set -uo pipefail
          count() { npx playwright test --list --project=chromium "$@" 2>/dev/null | grep -oE 'Total: [0-9]+' | grep -oE '[0-9]+' || true; }
          normal=$(count --grep-invert @quarantine); normal=${normal:-0}
          quarantined=$(count --grep @quarantine); quarantined=${quarantined:-0}
          echo "$normal normal tests, $quarantined quarantined"
          matrix=$(node -e '
            const [normal, quarantined] = process.argv.slice(1).map(Number);
            const jobs = [];
            const shards = (n, per, max) => Math.max(1, Math.min(max, Math.ceil(n / per)));
            const a = shards(normal, 200, 12);
            for (let i = 1; i <= a; i++) jobs.push({ kind: "normal", shard: i, total: a });
            if (quarantined > 0) { const b = shards(quarantined, 10, 20); for (let i = 1; i <= b; i++) jobs.push({ kind: "quarantine", shard: i, total: b }); }
            console.log(JSON.stringify(jobs));
          ' "$normal" "$quarantined")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  studio:
    # In the public repository this runs on every pull request and every push to main. Anywhere else (a private copy, where a run costs money) it only runs when it is started by hand.
    if: github.repository == 'ample-koda/ample' || github.event_name == 'workflow_dispatch'
    # The browser tests of the studio (Playwright, Chromium): they start the built command line tool and drive its pages. They run in shards at the same time.
    name: Studio browser tests (${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: studio-plan
    runs-on: ubuntu-24.04
    # the quarantined tests are reported, but a failure of theirs does not fail the run
    continue-on-error: ${{ matrix.kind == 'quarantine' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.studio-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Keep the NuGet packages between runs
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build the command line tool
        run: dotnet build src/Ample.Cli -c Release --nologo
      - name: Install the test tools
        run: npm ci
      - name: Keep Chromium between runs
        # the browser is downloaded once for a version of Playwright and kept; only the system libraries it needs are installed on every run
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install the system libraries of Chromium
        run: npx playwright install-deps chromium
      - name: Cache the General MIDI SoundFont
        # the tests that play General MIDI need it; it is fetched once and kept between runs
        uses: actions/cache@v4
        with:
          path: audio-packs/licensed/musescore-general
          key: musescore-general-${{ hashFiles('tools/fetch-gm-soundfont.mjs') }}
      - name: Fetch the General MIDI SoundFont
        # the script checks the size and the pinned SHA-256 of the SoundFont, and does not download again when the file is already there (from the cache)
        run: node tools/fetch-gm-soundfont.mjs --download --into
      - name: Run this part of the browser tests
        # no retry: a test that fails fails (the owner's rule); the traces and the report below show why
        env:
          KIND: ${{ matrix.kind }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: report-${{ matrix.kind }}-${{ matrix.shard }}.json
        run: |
          set -uo pipefail
          if [ "$KIND" = quarantine ]; then selection="--grep @quarantine --workers=1"; else selection="--grep-invert @quarantine --workers=2"; fi
          npx playwright test --project=chromium $selection --shard="$SHARD/$TOTAL" --trace=retain-on-failure --reporter=list,json
      - name: Keep the traces and the report of the failed tests
        # a trace shows the page, the steps and the console of a test that failed (npx playwright show-trace); the report feeds tools/quarantine-failed.mjs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-failures-${{ matrix.kind }}-${{ matrix.shard }}
          path: |
            test-results/
            report-*.json
          retention-days: 7

name: AMPLE release

# A release is made by hand (workflow_dispatch) and only ever DRAFTED: nothing publishes itself.
# The owner reads the draft, signs the manifest and the artefacts on their own machine (tools/sign-release.ps1), uploads the
# signatures and publishes. No signing key is ever in this workflow (installer plan 4.4 and 4.5, phase 1).
# To start on a tag again, uncomment the push trigger.
on:
  # push:
  #   tags:
  #     - 'ample-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The sources are checked on Ubuntu: the build with warnings as errors, the format check, the node and spec checks and the dependency audit. The test projects
    # and the browser tests are NOT repeated here: the public CI runs them for every commit on main (a release is made from a commit that has been through it).
    # Nothing is retried, no time-out is lengthened.
    name: Check the sources (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the dependencies
        run: npm ci
      - name: Check the sources
        run: bash ./tools/check-all.sh --skip-tests
      - name: Audit the dependencies
        run: |
          set -u
          dotnet list Ample.sln package --vulnerable --include-transitive | tee audit-dotnet.txt
          if grep -q 'has the following vulnerable packages' audit-dotnet.txt; then echo 'vulnerable .NET packages'; exit 1; fi
          npm audit --omit=dev

  build:
    name: Build and package (Windows builds both zips)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if (-not $v -or $v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { throw "The version '$v' in Directory.Build.props is not x.y.z or x.y.z-suffix." }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install AMPLE web and editor test dependencies
        run: npm ci
      - name: Package (win-x64 and linux-x64 zips, the dotnet tool, the VS Code extension)
        shell: pwsh
        run: ./tools/package.ps1
      - name: Smoke test the Windows package
        shell: pwsh
        run: ./tools/smoke-package.ps1
      - name: Keep the artefacts for the next jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.nupkg
            dist/*.vsix
            dist/SHA256SUMS.txt
          if-no-files-found: error

  msi:
    name: Windows installer (MSI, per user, no UAC)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Install WiX 6.0.2 and its two extensions (the version is pinned)
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --version 6.0.2 --tool-path $wix
          if ($LASTEXITCODE -ne 0) { throw 'wix did not install' }
          & "$wix\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          & "$wix\wix.exe" extension add -g WixToolset.Util.wixext/6.0.2
      - name: Build the tray hub and the setup wizard
        shell: pwsh
        run: ./install/msi/build-hub.ps1 -Out (Join-Path $env:RUNNER_TEMP 'hub')
      - name: Build the MSI from the Windows zip
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ./install/msi/build-msi.ps1 -Zip "dist/ample-$env:VERSION-win-x64.zip" -Out "dist/ample-$env:VERSION-win-x64.msi" -Wix (Join-Path $env:RUNNER_TEMP 'wix\wix.exe') -HubDir (Join-Path $env:RUNNER_TEMP 'hub')
      - name: Test the MSI (silent install without extras, run, uninstall, nothing left)
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $msi = (Resolve-Path "dist/ample-$env:VERSION-win-x64.msi").Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AMPLE\msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', 'SKIPEXTRAS=1' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          & "$dir\ample.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed program does not run' }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path -LiteralPath $dir) { throw "the uninstall left $dir behind" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  linux-debs:
    name: Debian packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Unpack the Linux program
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          mkdir -p work
          unzip -q "dist/ample-${VERSION}-linux-x64.zip" -d work
          test -f "work/ample-${VERSION}-linux-x64/ample"
          chmod +x "work/ample-${VERSION}-linux-x64/ample"
      - name: Keep the SoundFont between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ample-home
          key: musescore-general-pack-${{ hashFiles('tools/fetch-gm-soundfont.mjs') }}
      - name: Fetch the pinned SoundFont (checked by SHA-256 by the program; not downloaded again when the cache has it)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          "work/ample-${VERSION}-linux-x64/ample" packs install soundfont --home "$RUNNER_TEMP/ample-home"
      - name: Build the Debian packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          sh tools/build-deb.sh --version "$VERSION" --program "work/ample-${VERSION}-linux-x64" --out debs \
            --soundfont "$RUNNER_TEMP/ample-home/audio-packs/licensed/musescore-general/MuseScore_General.sf2" \
            --licence LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debs
          path: debs/*.deb
          if-no-files-found: error

  manifest:
    name: The release manifest
    needs: [build, msi, linux-debs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: msi
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debs
          path: debs
      - name: Unpack the Linux program
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          mkdir -p work
          unzip -q "dist/ample-${VERSION}-linux-x64.zip" -d work
          chmod +x "work/ample-${VERSION}-linux-x64/ample"
      - name: "Write the release manifest (unsigned, the owner signs it): zips, tool, extension, MSI and Debian packages"
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          "work/ample-${VERSION}-linux-x64/ample" release manifest --version "$VERSION" \
            --spec-version-file "work/ample-${VERSION}-linux-x64/spec/version.json" \
            --out "dist/ample-${VERSION}.manifest.json" dist/*.zip dist/*.nupkg dist/*.vsix dist/*.msi debs/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-extras
          path: |
            dist/*.manifest.json
            debs/*.deb
          if-no-files-found: error

  linux-test:
    name: Linux test (${{ matrix.os }})
    needs: [build, linux-debs]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debs
          path: extras/debs
      - name: Smoke test the Linux zip
        shell: pwsh
        run: ./tools/smoke-package.ps1
      - name: Check the install script's parser and cleanup
        run: sh install/test-install-logic.sh
      - name: Install the Debian packages and look at the result
        run: |
          set -eu
          sudo apt-get install -y ./extras/debs/*.deb
          ample --version
          ample doctor --env
          dpkg --verify ample-koda ample-soundfont
          sudo apt-get remove -y ample-koda ample-soundfont
          test ! -e /usr/lib/ample && test ! -e /usr/bin/ample

  draft:
    name: Draft the release
    needs: [build, msi, manifest, linux-test]
    # the draft is made when everything that is BUILT and INSTALLED is fine; the test run of the sources (check) is reported but does not hold the draft back (owner, 2026-11-06: it is a beta, and the draft is only read by the owner and signed by hand before anything is public)
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.msi.result == 'success' && needs.manifest.result == 'success' && needs.linux-test.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: msi
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-extras
          path: extras
      - name: "Draft the release (the files are unsigned; sign them on the machine with the key, then publish)"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          tag_name: ample-v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/*.nupkg
            dist/*.vsix
            dist/*.msi
            dist/SHA256SUMS.txt
            extras/dist/*.manifest.json
            extras/debs/*.deb

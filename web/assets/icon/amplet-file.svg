<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AMPLE song file">
  <title>AMPLE song file (.amplet)</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de2ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowNote" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the page with its folded corner, in neon -->
  <path d="M52 20 H152 L212 80 V236 H52Z" fill="#12162b"/>
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 20 H152 L212 80 V236 H52Z"/>
    <path d="M152 20 V80 H212"/>
  </g>
  <!-- the A of AMPLE with its white wave as crossbar -->
  <path d="M92 208 L132 106 L172 208" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108 174 q8 -22 16 0 t16 0 t16 0" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the teal eighth note in the top left corner of the page -->
  <g filter="url(#glowNote)">
    <ellipse cx="86" cy="78" rx="11" ry="8" fill="#19e3c8" transform="rotate(-20 86 78)"/>
    <path d="M96 76 V44 q12 3 17 17" fill="none" stroke="#19e3c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
